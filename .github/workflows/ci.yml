name: CI

on:
  pull_request:
  workflow_call: # reused by deploy.yml so main is always verified before deploying

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  # Fast feedback: static checks, unit and script tests, iOS bundle, Expo web build, Worker bundle. No database.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: >-
          docker run --rm --network=none -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --config=/repo/.gitleaks.toml --redact=100 --no-banner --log-opts="--all" /repo
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      - name: Migrations match the Drizzle schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            echo "::error::schema.ts changed without a migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain supabase/migrations
            exit 1
          fi

      - name: Schema diagram is up to date
        run: |
          pnpm db:erd
          if [ -n "$(git status --porcelain docs/schema.md)" ]; then
            echo "::error::docs/schema.md is out of date. Run 'pnpm db:erd' and commit the result."
            git diff docs/schema.md
            exit 1
          fi

      - name: Unit + script tests
        run: |
          pnpm -r --filter './packages/*' --filter @picks/api test
          node --test scripts/*.test.mjs

      - name: Native client tests and iOS JavaScript bundle
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          pnpm --filter @picks/mobile test
          pnpm --filter @picks/mobile export:ios

      # The Expo web build becomes the Worker's static assets, so it goes first.
      - name: Build the Expo web app and bundle the Worker
        env:
          EXPO_NO_TELEMETRY: "1"
        run: pnpm build

  # Full stack: local Supabase, DB-backed API tests, Playwright E2E against the Worker.
  e2e:
    runs-on: ubuntu-latest
    # Room for the browser install's retries (below) ahead of about eight minutes of tests.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Supabase's ports overlap Linux's ephemeral range. Reserve them before
      # image pulls can claim a checked-free port for an outbound connection.
      # Keep any reservations already configured on the runner.
      - name: Reserve Supabase ports from ephemeral allocation
        run: |
          reserved=$(sysctl -n net.ipv4.ip_local_reserved_ports)
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${reserved:+$reserved,}54320-55319"

      - name: Select free local ports
        run: node scripts/ci-ports.mjs >> "$GITHUB_ENV"

      - name: Start local Supabase (applies migrations + seed)
        run: pnpm db:start

      - name: Export Supabase env
        run: node scripts/supabase-env.mjs >> "$GITHUB_ENV"

      - name: DB-backed API tests
        run: pnpm --filter @picks/api test

      # WebKit's system packages come from Ubuntu's mirrors, which now and then answer 503, serve a stale index or
      # slow to a crawl. A failure here fails `e2e`, and on main that skips the deploy, so apt retries each
      # download and the whole install gets three tries of five minutes (a healthy one takes under a minute).
      - name: Install Playwright browsers
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' |
            sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
          for attempt in 1 2 3; do
            if timeout --kill-after=10 300 pnpm playwright:install; then exit 0; fi
            echo "::warning::Installing Playwright's browsers failed or stalled (attempt $attempt of 3)."
            [ "$attempt" = 3 ] && break
            # A timed-out attempt can leave apt running as root, holding its locks.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend
            sudo dpkg --configure -a || true
            sleep 20
          done
          exit 1

      # Against the production build in the Workers runtime (`pnpm worker:dev`), as every E2E run is.
      - name: E2E tests
        run: pnpm test:e2e
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 3
