name: CI

on:
  pull_request:
  workflow_call: # reused by deploy.yml so main is always verified before deploying

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  # Fast feedback: static checks, unit and script tests, iOS bundle, Expo web build, Worker bundle. No database.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: >-
          docker run --rm --network=none -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --config=/repo/.gitleaks.toml --redact=100 --no-banner --log-opts="--all" /repo
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      - name: Migrations match the Drizzle schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            echo "::error::schema.ts changed without a migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain supabase/migrations
            exit 1
          fi

      - name: Schema diagram is up to date
        run: |
          pnpm db:erd
          if [ -n "$(git status --porcelain docs/schema.md)" ]; then
            echo "::error::docs/schema.md is out of date. Run 'pnpm db:erd' and commit the result."
            git diff docs/schema.md
            exit 1
          fi

      - name: Unit + script tests
        run: |
          pnpm -r --filter './packages/*' --filter @picks/api test
          node --test scripts/*.test.mjs

      - name: Native client tests and iOS JavaScript bundle
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          pnpm --filter @picks/mobile test
          pnpm --filter @picks/mobile export:ios

      # The Expo web build becomes the Worker's static assets, so it goes first.
      - name: Build the Expo web app and bundle the Worker
        env:
          EXPO_NO_TELEMETRY: "1"
        run: pnpm build

  # Full stack: local Supabase, DB-backed API tests, Playwright E2E against the Worker.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Supabase's ports overlap Linux's ephemeral range. Reserve them before
      # image pulls can claim a checked-free port for an outbound connection.
      # Keep any reservations already configured on the runner.
      - name: Reserve Supabase ports from ephemeral allocation
        run: |
          reserved=$(sysctl -n net.ipv4.ip_local_reserved_ports)
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${reserved:+$reserved,}54320-55319"

      - name: Select free local ports
        run: node scripts/ci-ports.mjs >> "$GITHUB_ENV"

      - name: Start local Supabase (applies migrations + seed)
        run: pnpm db:start

      - name: Export Supabase env
        run: node scripts/supabase-env.mjs >> "$GITHUB_ENV"

      - name: DB-backed API tests
        run: pnpm --filter @picks/api test

      - name: Install Playwright browsers
        run: pnpm playwright:install

      # Against the production build in the Workers runtime (`pnpm worker:dev`), as every E2E run is.
      - name: E2E tests
        run: pnpm test:e2e
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 3
