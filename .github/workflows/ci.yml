name: CI

on:
  pull_request:
  workflow_call: # reused by deploy.yml so main is always verified before deploying

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: static checks, unit tests, component tests (real Chromium). No database.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      - name: Migrations match the Drizzle schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            echo "::error::schema.ts changed without a migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain supabase/migrations
            exit 1
          fi

      - name: Install Chromium for component tests
        run: pnpm --filter @picks/web exec playwright install --with-deps chromium

      - name: Unit + component tests
        run: pnpm test

  # Full stack: local Supabase, DB-backed API tests, the production build, Playwright E2E.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase (applies migrations + seed)
        run: pnpm db:start

      - name: Export Supabase env
        run: node scripts/supabase-env.mjs >> "$GITHUB_ENV"

      - name: DB-backed API tests
        run: pnpm --filter @picks/api test

      - name: Build the Vercel deployment output
        run: pnpm build:vercel

      - name: Smoke-test the built API function
        run: pnpm smoke:vercel

      - name: Install Playwright browsers
        run: pnpm playwright:install

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
