name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  migrate:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    # A hung `db push` would otherwise hold the deploy-production lock for the 6 h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations run BEFORE the new code ships, so they must be backward-compatible
      # with the currently running version (add columns first, drop them in a later deploy).
      # Uses the same verified-TLS policy as the API, without logging URL values or raw errors.
      - name: Check database connection string
        run: node scripts/check-db-url.mjs --quiet
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Apply migrations
        run: pnpm sb db push --yes --remote="$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One Worker serves the web build and the API, so both go live together. The SPA is fetched fresh on
      # each visit, but an open tab keeps the old one: keep the API backward-compatible for a deploy.
      - name: Build web app and Worker
        run: pnpm build
      - name: Deploy to Cloudflare
        run: pnpm --filter @picks/api exec wrangler deploy --message "${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A failed check doesn't undo the deploy: roll back with `wrangler rollback` (README, "Release sequence").
      - name: Check the live API
        run: node scripts/check-live.mjs
        env:
          APP_URL: ${{ vars.APP_URL }}
