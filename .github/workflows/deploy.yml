name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  migrate:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations run BEFORE the new code ships, so they must be backward-compatible
      # with the currently running version (add columns first, drop them in a later deploy).
      # Describes the connection string (never the password) and tests it, so a bad secret fails here with
      # a clear explanation instead of an opaque error from the migration tool.
      - name: Check database connection string
        run: node scripts/check-db-url.mjs --quiet
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Apply migrations
        run: pnpm supabase db push --yes --remote="$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false # this job has no dependencies, and pnpm isn't installed here
      # Render builds the Dockerfile at this commit. The step waits until the release is live and fails if it isn't.
      - name: Deploy to Render
        run: node scripts/render-deploy.mjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
