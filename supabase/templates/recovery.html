<!doctype html>
<!-- Supabase Auth template (Go templates). Keep in sync with the hosted project: see README, "Email".
     The link: from the website, the page that asked (RedirectTo) with #token_hash and type, which the app
     verifies itself, so it works in any browser; from the iPhone app (RedirectTo pow-pickem:…), Auth's own
     ConfirmationURL, which opens the app on that phone. -->
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Reset your password</title></head>
<body style="margin:0;padding:0;background:#eef1f7;font-family:Arial,Helvetica,sans-serif;color:#070d1f;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef1f7;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:2px;overflow:hidden;">
<tr><td style="background:#070d1f;border-bottom:3px solid #ff3d5e;padding:14px 24px;color:#ffffff;font-size:20px;font-weight:bold;letter-spacing:0.5px;text-transform:uppercase;">POW Pick'em</td></tr>
<tr><td style="padding:24px;">
<h1 style="margin:0 0 16px;font-size:22px;line-height:1.25;color:#070d1f;">Reset your password</h1>
<p style="margin:0;font-size:15px;line-height:1.5;color:#55607a;">Someone (hopefully you) asked to reset the password for your POW Pick'em account. Follow the link to choose a new one.</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0 8px;"><tr><td style="background:#2f5fe0;border-radius:2px;">
<a href="{{ if eq (printf `%.11s` .RedirectTo) `pow-pickem:` }}{{ .ConfirmationURL }}{{ else }}{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=recovery{{ end }}" style="display:inline-block;padding:12px 22px;color:#ffffff;font-weight:bold;text-decoration:none;text-transform:uppercase;letter-spacing:0.5px;">Choose a new password</a>
</td></tr></table>
<p style="margin:16px 0 0;font-size:13px;line-height:1.5;color:#55607a;">The link works once and expires in an hour. If you didn't ask for this, ignore this email: your password stays the same.</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
